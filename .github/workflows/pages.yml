name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Commits pushed by the weekly data job don't trigger `push` workflows
  # (GITHUB_TOKEN pushes never do), so redeploy explicitly when it finishes.
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # after a data update, build the commit it just pushed
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build for /<repo>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages has no rewrites: serve the app for unknown paths so deep links
      # like /politicians/matteo-salvini work.
      - run: cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

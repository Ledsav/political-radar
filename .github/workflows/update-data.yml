name: Update data

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

      # Classifies new verdict sentences only when the ANTHROPIC_API_KEY secret
      # is set; otherwise they are left out of the scores until a later run.
      - name: Fetch, classify and export
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m radar all

      - name: Commit if the data changed
        working-directory: .
        run: |
          # meta.json carries a timestamp that changes on every run; ignore it on its own.
          if [ -z "$(git status --porcelain -- public/data pipeline/data | grep -v 'public/data/meta.json')" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data pipeline/data/verdict_labels.json
          git commit -m "data: weekly update from Pagella Politica"
          git push
